[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiact-compliance-suite"
version = "0.1.0"
description = "EU AI Act article-level compliance evaluation suite for LLMs (EN/FI multilingual)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tridib", email = "your-email@example.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
aiact-eval = "aiact_compliance.cli:main"

[project.urls]
Homepage = "https://github.com/indrang21/aiact-compliance-suite"
Repository = "https://github.com/indrang21/aiact-compliance-suite"
Issues = "https://github.com/indrang21/aiact-compliance-suite/issues"

[tool.setuptools.packages.find]
include = ["aiact_compliance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
